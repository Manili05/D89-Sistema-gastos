# Etapa 2 (con certificado): HTTPS público hacia Caddy; HTTP sólo redirige y
# atiende el reto ACME para las renovaciones. Requiere el certificado emitido por
# infra/scripts/enable-d89-tls.sh (certbot --webroot). Ver infra/nginx/README.md.
# Nginx 1.24: `listen ... ssl http2` (la directiva `http2 on` llegó en 1.25.1).
server {
  listen 80;
  listen [::]:80;
  server_name d89.escalaleads.com.mx;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name d89.escalaleads.com.mx;

  ssl_certificate /etc/letsencrypt/live/d89.escalaleads.com.mx/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/d89.escalaleads.com.mx/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Sin includeSubDomains/preload: escalaleads.com.mx tiene otros subdominios
  # que no se gestionan aquí.
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass http://127.0.0.1:3089;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    # La API limita CSF, tickets y NEODATA a 10 MB; el margen cubre el multipart.
    client_max_body_size 12m;
  }
}
