# Etapa 1 (sin certificado): HTTP hacia Caddy + reto ACME de Let's Encrypt.
# Se puede instalar antes de que exista el certificado; lo usa enable-d89-tls.sh
# para emitirlo con `certbot certonly --webroot`. Ver infra/nginx/README.md.
server {
  listen 80;
  listen [::]:80;
  server_name d89.escalaleads.com.mx;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    proxy_pass http://127.0.0.1:3089;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    # La API limita CSF, tickets y NEODATA a 10 MB; el margen cubre el multipart.
    client_max_body_size 12m;
  }
}
