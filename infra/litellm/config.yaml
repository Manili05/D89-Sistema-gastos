# Modelos vigentes (2026). La imagen v1.83.3-stable no trae precio para los modelos
# Gemini 3.x ni Claude 5; `model_info` copia la tarifa del mapa oficial de LiteLLM
# (model_prices_and_context_window.json) para que el tope mensual los contabilice.
x-model-defaults: &defaults
  timeout: 60
  stream_timeout: 60
  max_retries: 2

model_list:
  - model_name: kimi-k3
    litellm_params:
      <<: *defaults
      model: moonshot/kimi-k3
      api_key: os.environ/MOONSHOT_API_KEY

  # --- Modelos base, disponibles por nombre ---
  - model_name: gemini-3.8-flash
    litellm_params: { <<: *defaults, model: gemini/gemini-3.8-flash, api_key: os.environ/GEMINI_API_KEY }
    model_info: &gemini_flash_price { input_cost_per_token: 7.5e-07, output_cost_per_token: 3.75e-06 }

  - model_name: gemini-3.6-flash
    litellm_params: { <<: *defaults, model: gemini/gemini-3.6-flash, api_key: os.environ/GEMINI_API_KEY }
    model_info: *gemini_flash_price

  - model_name: gemini-3.5-flash-lite
    litellm_params: { <<: *defaults, model: gemini/gemini-3.5-flash-lite, api_key: os.environ/GEMINI_API_KEY }
    model_info: &gemini_lite_price { input_cost_per_token: 3.0e-07, output_cost_per_token: 2.5e-06 }

  - model_name: claude-sonnet-5
    litellm_params: { <<: *defaults, model: anthropic/claude-sonnet-5, api_key: os.environ/ANTHROPIC_API_KEY }
    model_info: { input_cost_per_token: 2.0e-06, output_cost_per_token: 1.0e-05 }

  # Registrado pero fuera de las cadenas automáticas por costo frente al tope mensual.
  - model_name: claude-opus-5-5
    litellm_params: { <<: *defaults, model: anthropic/claude-opus-5-5, api_key: os.environ/ANTHROPIC_API_KEY }
    model_info: { input_cost_per_token: 4.0e-06, output_cost_per_token: 2.0e-05 }

  # --- Alias de extracción que usa la API (constitution §3.6) ---
  # CSF: PDF impreso del SAT, tarea sencilla -> modelo más económico.
  - model_name: d89-documentos
    litellm_params: { <<: *defaults, model: gemini/gemini-3.5-flash-lite, api_key: os.environ/GEMINI_API_KEY }
    model_info: *gemini_lite_price

  # Tickets y notas de remisión: caligrafía y fotos de campo.
  - model_name: d89-vision
    litellm_params: { <<: *defaults, model: gemini/gemini-3.8-flash, api_key: os.environ/GEMINI_API_KEY }
    model_info: *gemini_flash_price

router_settings:
  # Los respaldos aplican sólo a los alias d89-*; las llamadas por nombre base no cambian.
  fallbacks:
    - d89-documentos: [gemini-3.6-flash, claude-sonnet-5]
    - d89-vision: [claude-sonnet-5]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  store_model_in_db: true
  disable_spend_logs: false

litellm_settings:
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  drop_params: true
  request_timeout: 60
